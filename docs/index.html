(function(){
  var sel=document.getElementById("lang"),root=document.documentElement;
  Object.keys(LANGS).forEach(function(k){var o=document.createElement("option");o.value=k;o.textContent=LANGS[k];sel.appendChild(o)});
  function safe(f){try{return f()}catch(e){return null}}
  function pick(){
    var q=new URLSearchParams(location.search).get("lang");
    if(q&&T[q])return q;
    var s=safe(function(){return localStorage.getItem("lang")});
    if(s&&T[s])return s;
    var l=(navigator.languages||[navigator.language||"en"]);
    for(var i=0;i<l.length;i++){var c=String(l[i]).slice(0,2).toLowerCase();if(T[c])return c}
    return "en";
  }
  function apply(code){
    var t=T[code];root.lang=code;sel.value=code;
    document.title=t.h1;
    document.querySelectorAll("[data-i]").forEach(function(e){var k=e.getAttribute("data-i");if(k==="name")e.textContent=t.h1;else if(t[k]!=null)e.textContent=t[k]});
    document.querySelector("meta[name=description]").content=t.lead;
    var f=document.getElementById("features");f.textContent="";
    t.f.forEach(function(x){var d=document.createElement("div");d.className="card";var h=document.createElement("h3");h.textContent=x[0];var p=document.createElement("p");p.textContent=x[1];d.appendChild(h);d.appendChild(p);f.appendChild(d)});
    document.querySelectorAll("img").forEach(function(i){i.alt=t.h1});
  }
  sel.addEventListener("change",function(){safe(function(){localStorage.setItem("lang",sel.value)});apply(sel.value)});
  document.getElementById("theme").addEventListener("click",function(){
    var dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    root.dataset.theme=dark?"light":"dark";
  });
  apply(pick());
})();
</script>
</body>
</html>
