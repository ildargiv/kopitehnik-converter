name: Release build

# Tag v3.1 -> builds the installer on GitHub's servers from the public source and creates a DRAFT release
# with KopiTehnik-Converter-Setup.exe and SHA256SUMS.txt. The draft is published by hand.
# Run by hand (Actions -> Release build -> Run workflow) to get the files as a build artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # draft release
  id-token: write        # build provenance
  attestations: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches core/version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import sys; sys.path.insert(0,'.'); from core.version import VERSION; print(VERSION)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but core/version.py has $v"; exit 1; }

      - name: Install dependencies
        run: pip install PySide6 pillow pillow-heif openpyxl pymupdf rapidocr opencv-python pyinstaller

      - name: Build installer
        run: python tools/installer/build.py

      - name: SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum KopiTehnik-Converter-Setup.exe | sed 's/  / */' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/KopiTehnik-Converter-Setup.exe

      # Free code signing for open source (see docs/signpath-application.md): add the SignPath step
      # here, before the checksums, after SignPath approves the project.

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/KopiTehnik-Converter-Setup.exe
            dist/SHA256SUMS.txt

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/KopiTehnik-Converter-Setup.exe
            dist/SHA256SUMS.txt
          body: |
            SHA-256 of `KopiTehnik-Converter-Setup.exe` is in `SHA256SUMS.txt`
            (check: `certutil -hashfile KopiTehnik-Converter-Setup.exe SHA256`).
            The file is built by GitHub Actions from this repository's source; build attestation is attached.
